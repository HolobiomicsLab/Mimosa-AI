<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Mimosa-AI: evolving scientific workflows with Policy-BT</title><desc id="desc">Mimosa-AI evolution loop with the Policy-BT verifier. A task goal, input data and available scientific tools condition LLM synthesis of a custom multi-agent workflow as executable Python (the genotype). Initialization can include multiple seed generations before parent-driven variation. The runner resets the workspace to its initial state, executes the workflow through the sandboxed runner and saves the produced artifacts. Policy-BT takes owned snapshots, assesses a mandatory reproduction script and, by default, reruns it in a fresh virtual environment. Goal-grounded reconnaissance fixes the comparison criteria and builds schema adapters. A cached deterministic Python policy compares each pair of generation workspaces; relevant images can resolve code ties only with agreement across both presentation orders. A regularized Bradley–Terry fit over all pair outcomes refreshes the current rewards of every generation. The default quality–diversity search combines those rewards with genotype-embedding novelty and a code-length penalty, admits survivors and selects parents. Mutation converts the selected parent’s diagnosis and search state into a directive for the code-generating LLM; crossover recombines selected parent workflows and their feedback without a separate mutation-directive call. Thus the next candidate need not descend from the most recent generation. The loop continues until the configured stopping rule or generation limit. With Policy-BT auto stopping, the rule is a head-to-head champion plateau after the minimum iteration count. The final workspace is restored from the generation with the highest current Bradley–Terry rating, not necessarily the last generation or the stopping controller’s champion. The diagram shows the successful generation path: generation/execution failures and verifier instrument errors are unscored and excluded from QD admission; reproduction-ineligible generations receive a published reward of zero and still contribute admission pair outcomes to the tournament. Verifier reruns are trusted local shell execution, not the workflow sandbox. Planner mode supplies task goals to this per-task loop; the planner is optional and outside the loop. The mini agent graph is schematic, not a fixed agent count or topology.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="61.54" font-size="38" fill="#182C40" font-weight="700">Mimosa-AI: evolving scientific workflows with Policy-BT</text><text x="48" y="102.25999999999999" font-size="22" fill="#526779" font-weight="400">Code is the genotype. Workspace artifacts are the evidence. Selection and feedback drive the next generation.</text><rect x="48" y="137" width="932" height="68" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="70" y="169.75" font-size="25" fill="#087F82" font-weight="700">Task goal + input data</text><text x="402" y="168.43" font-size="21" fill="#087F82" font-weight="400">Scientific tools via MCP · optional literature grounding</text><polyline points="263,205 263,238" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="263,238 267.32,229.0 258.68,229.0" fill="#087F82"/><polyline points="765,205 765,238" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="765,238 769.32,229.0 760.68,229.0" fill="#087F82"/><rect x="48" y="238" width="430" height="235" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="77.0" cy="268.0" rx="15.0" ry="15.0" fill="#2463A5" stroke="#2463A5" stroke-width="1.8"/><text x="69" y="271.77" font-size="19" fill="#FFFFFF" font-weight="700">1</text><text x="102" y="272.75" font-size="25" fill="#182C40" font-weight="700">Synthesize a workflow</text><text x="72" y="324.41" font-size="27" fill="#2463A5" font-weight="700">LLM → executable Python</text><text x="72" y="362.43" font-size="21" fill="#526779" font-weight="400">Agents, prompts, tools and control flow</text><text x="72" y="394.43" font-size="21" fill="#526779" font-weight="400">Seed / template during initialization</text><ellipse cx="92.0" cy="432.0" rx="14.0" ry="14.0" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.8"/><ellipse cx="195.0" cy="432.0" rx="14.0" ry="14.0" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.8"/><ellipse cx="298.0" cy="432.0" rx="14.0" ry="14.0" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.8"/><ellipse cx="402.0" cy="432.0" rx="14.0" ry="14.0" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.8"/><polyline points="106,432 181,432" fill="none" stroke="#2463A5" stroke-width="2" stroke-linejoin="round"/><polygon points="181,432 172.0,427.68 172.0,436.32" fill="#2463A5"/><polyline points="209,432 284,432" fill="none" stroke="#2463A5" stroke-width="2" stroke-linejoin="round"/><polygon points="284,432 275.0,427.68 275.0,436.32" fill="#2463A5"/><polyline points="312,432 387,432" fill="none" stroke="#2463A5" stroke-width="2" stroke-linejoin="round"/><polygon points="387,432 378.0,427.68 378.0,436.32" fill="#2463A5"/><text x="82" y="434.94" font-size="18" fill="#2463A5" font-weight="700">A</text><text x="185" y="434.94" font-size="18" fill="#2463A5" font-weight="700">B</text><text x="288" y="434.94" font-size="18" fill="#2463A5" font-weight="700">C</text><text x="392" y="434.94" font-size="18" fill="#2463A5" font-weight="700">D</text><rect x="550" y="238" width="430" height="235" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="579.0" cy="268.0" rx="15.0" ry="15.0" fill="#087F82" stroke="#087F82" stroke-width="1.8"/><text x="571" y="271.77" font-size="19" fill="#FFFFFF" font-weight="700">2</text><text x="604" y="272.75" font-size="25" fill="#182C40" font-weight="700">Execute the workflow</text><text x="574" y="323.58" font-size="26" fill="#087F82" font-weight="700">Sandboxed workflow runner</text><text x="574" y="363.43" font-size="21" fill="#526779" font-weight="400">Reset workspace to the initial inputs</text><text x="574" y="397.43" font-size="21" fill="#526779" font-weight="400">Run agents and scientific tools</text><text x="574" y="431.43" font-size="21" fill="#526779" font-weight="400">Save scripts, logs, tables and figures</text><polyline points="478,355 550,355" fill="none" stroke="#2463A5" stroke-width="3" stroke-linejoin="round"/><polygon points="550,355 541.0,350.68 541.0,359.32" fill="#2463A5"/><polyline points="980,355 1016,355 1016,258 1076,258" fill="none" stroke="#087F82" stroke-width="3" stroke-linejoin="round"/><polygon points="1076,258 1067.0,253.68 1067.0,262.32" fill="#087F82"/><rect x="1052" y="137" width="500" height="599" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="1081.0" cy="167.0" rx="15.0" ry="15.0" fill="#AF6425" stroke="#AF6425" stroke-width="1.8"/><text x="1073" y="170.77" font-size="19" fill="#FFFFFF" font-weight="700">3</text><text x="1106" y="171.75" font-size="25" fill="#182C40" font-weight="700">Policy-BT verifier</text><rect x="1076" y="202" width="452" height="112" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="1096" y="237.75" font-size="25" fill="#087F82" font-weight="700">Preserve + reproduce</text><text x="1096" y="274.26" font-size="22" fill="#526779" font-weight="400">Owned snapshots; required .sh contract</text><text x="1096" y="305.26" font-size="22" fill="#526779" font-weight="400">Fresh-venv rerun enabled by default</text><polyline points="1302,316 1302,338" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1302,338 1306.32,329.0 1297.68,329.0" fill="#087F82"/><rect x="1076" y="341" width="452" height="144" rx="12" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.5"/><text x="1096" y="376.75" font-size="25" fill="#2463A5" font-weight="700">Code-first pairwise comparison</text><text x="1096" y="413.26" font-size="22" fill="#526779" font-weight="400">Goal → fixed criteria + schema adapters</text><text x="1096" y="444.26" font-size="22" fill="#526779" font-weight="400">One cached deterministic Python policy</text><text x="1096" y="475.26" font-size="22" fill="#526779" font-weight="400">Relevant images may resolve code ties</text><polyline points="1302,487 1302,510" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1302,510 1306.32,501.0 1297.68,501.0" fill="#2463A5"/><rect x="1076" y="513" width="452" height="111" rx="12" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1096" y="548.75" font-size="25" fill="#AF6425" font-weight="700">Bradley–Terry tournament</text><text x="1096" y="585.26" font-size="22" fill="#526779" font-weight="400">All generation pairs in the task session</text><text x="1096" y="610.26" font-size="22" fill="#526779" font-weight="400">Refit every generation’s current reward</text><rect x="1076" y="649" width="452" height="34" rx="6" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1087" y="668.94" font-size="18" fill="#AF6425" font-weight="700">Numeric rewards + evidence-grounded diagnoses</text><text x="1076" y="713.77" font-size="19" fill="#A84943" font-weight="400">Reproduction failure → published reward 0</text><rect x="550" y="574" width="430" height="162" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="579.0" cy="604.0" rx="15.0" ry="15.0" fill="#AF6425" stroke="#AF6425" stroke-width="1.8"/><text x="571" y="607.77" font-size="19" fill="#FFFFFF" font-weight="700">4</text><text x="604" y="608.75" font-size="25" fill="#182C40" font-weight="700">QD archive + parent selection</text><text x="574" y="647.6" font-size="20" fill="#526779" font-weight="400">Refresh quality from current BT ratings</text><text x="574" y="675.6" font-size="20" fill="#526779" font-weight="400">Quality + code novelty − length penalty</text><text x="574" y="703.6" font-size="20" fill="#526779" font-weight="400">Retain survivors; select parent workflow(s)</text><rect x="48" y="574" width="430" height="162" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="77.0" cy="604.0" rx="15.0" ry="15.0" fill="#7752A6" stroke="#7752A6" stroke-width="1.8"/><text x="69" y="607.77" font-size="19" fill="#FFFFFF" font-weight="700">5</text><text x="102" y="608.75" font-size="25" fill="#182C40" font-weight="700">Mutation or crossover</text><text x="72" y="647.6" font-size="20" fill="#526779" font-weight="400">Mutation: parent diagnosis → LLM directive</text><text x="72" y="675.6" font-size="20" fill="#526779" font-weight="400">Crossover: recombine selected parent code</text><text x="72" y="703.6" font-size="20" fill="#526779" font-weight="400">Use the selected parents’ own feedback</text><polyline points="1052,665 980,665" fill="none" stroke="#AF6425" stroke-width="3" stroke-linejoin="round"/><polygon points="980,665 989.0,669.32 989.0,660.68" fill="#AF6425"/><text x="984" y="640.11" font-size="17" fill="#AF6425" font-weight="700">ratings</text><polyline points="550,665 478,665" fill="none" stroke="#AF6425" stroke-width="3" stroke-linejoin="round"/><polygon points="478,665 487.0,669.32 487.0,660.68" fill="#AF6425"/><text x="483" y="640.11" font-size="17" fill="#AF6425" font-weight="700">parents</text><polyline points="263,574 263,473" fill="none" stroke="#7752A6" stroke-width="3" stroke-linejoin="round"/><polygon points="263,473 258.68,482.0 267.32,482.0" fill="#7752A6"/><text x="75" y="516.6" font-size="20" fill="#7752A6" font-weight="700">Next-generation</text><polyline points="420,473 420,530 765,530 765,574" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="765,574 769.32,565.0 760.68,565.0" fill="#2463A5"/><rect x="454" y="507" width="273" height="37" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="466" y="529.77" font-size="19" fill="#2463A5" font-weight="700">Code embedding → novelty</text><polyline points="1302,736 1302,787 263,787 263,736" fill="none" stroke="#087F82" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="263,736 258.68,745.0 267.32,745.0" fill="#087F82"/><rect x="410" y="767" width="508" height="41" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="426" y="792.26" font-size="22" fill="#087F82" font-weight="700">Selected-parent textual feedback → variation</text><rect x="48" y="846" width="932" height="89" rx="12" fill="#EFF5FC" stroke="#D5DEE5" stroke-width="1.5"/><text x="70" y="880.09" font-size="23" fill="#2463A5" font-weight="700">Repeat until the configured stop condition or generation limit</text><text x="70" y="915.6" font-size="20" fill="#526779" font-weight="400">Policy-BT auto mode: champion plateau, after the minimum number of generations.</text><rect x="1052" y="835" width="500" height="100" rx="12" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1072" y="870.75" font-size="25" fill="#AF6425" font-weight="700">Restore the best workspace</text><text x="1072" y="907.26" font-size="22" fill="#526779" font-weight="400">Highest current BT rating—not the latest run</text><polyline points="980,891 1052,891" fill="none" stroke="#AF6425" stroke-width="3" stroke-linejoin="round"/><polygon points="1052,891 1043.0,886.68 1043.0,895.32" fill="#AF6425"/><text x="48" y="978.6" font-size="20" fill="#526779" font-weight="400">QD = quality–diversity.  Numeric rewards guide selection; textual diagnoses guide changes.  Benchmark grading is separate.</text><text x="75" y="542.6" font-size="20" fill="#7752A6" font-weight="700">prompt</text><polyline points="1528,665 1571,665 1571,885 1552,885" fill="none" stroke="#AF6425" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="1552,885 1561.0,889.32 1561.0,880.68" fill="#AF6425"/><text x="992" y="875.11" font-size="17" fill="#AF6425" font-weight="700">stop</text></g></svg>