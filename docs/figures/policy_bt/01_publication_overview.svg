<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Policy-BT: from workspace evidence to evolutionary feedback</title><desc id="desc">Policy-BT workspace evaluation. (A) The verifier preserves generation artifacts, checks a required reproduction contract and, by default, reruns the submitted shell script in a fresh virtual environment. Goal-grounded reconnaissance establishes fixed, ordered criteria and schema adapters that read actual artifacts. (B) A shared deterministic Python policy compares normalized evidence at the earliest decisive stage. A code tie may be resolved using relevant images from both sides, but only when judgments in both presentation orders agree. Each pair yields a winner or tie, a stage, evidence and side-specific feedback. (C) A regularized Bradley–Terry model fits all pair outcomes and updates each generation’s current reward. Numeric rewards support selection; evidence-grounded diagnoses guide mutation. Ineligible generations receive zero; the verifier does not supply a benchmark grade.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="61.54" font-size="38" fill="#182C40" font-weight="700">Policy-BT: from workspace evidence to evolutionary feedback</text><text x="48" y="102.25999999999999" font-size="22" fill="#526779" font-weight="400">One task, one fixed comparison contract; a growing tournament of generation workspaces.</text><rect x="48" y="142" width="420" height="590" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="77.0" cy="172.0" rx="15.0" ry="15.0" fill="#087F82" stroke="#087F82" stroke-width="1.8"/><text x="69" y="175.77" font-size="19" fill="#FFFFFF" font-weight="700">A</text><text x="102" y="176.75" font-size="25" fill="#182C40" font-weight="700">Admit and normalize</text><rect x="84" y="207" width="62" height="72" rx="4" fill="#FFFFFF" stroke="#087F82" stroke-width="1.5"/><rect x="75" y="217" width="62" height="72" rx="4" fill="#FFFFFF" stroke="#087F82" stroke-width="1.5"/><polyline points="87,235 123,235" fill="none" stroke="#087F82" stroke-width="2" stroke-linejoin="round"/><polyline points="87,249 123,249" fill="none" stroke="#087F82" stroke-width="2" stroke-linejoin="round"/><polyline points="87,263 111,263" fill="none" stroke="#087F82" stroke-width="2" stroke-linejoin="round"/><text x="165" y="230.75" font-size="25" fill="#182C40" font-weight="700">Generation workspace</text><text x="165" y="266.43" font-size="21" fill="#526779" font-weight="400">Scripts · logs · tables</text><text x="165" y="297.43" font-size="21" fill="#526779" font-weight="400">Goal-relevant figures</text><polyline points="258,304 258,330" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="258,330 262.32,321.0 253.68,321.0" fill="#087F82"/><rect x="74" y="332" width="368" height="130" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="94" y="367.75" font-size="25" fill="#087F82" font-weight="700">Snapshot + reproduction</text><text x="94" y="404.26" font-size="22" fill="#526779" font-weight="400">Required shell-script contract</text><text x="94" y="435.26" font-size="22" fill="#526779" font-weight="400">Fresh-venv rerun by default</text><rect x="94" y="476" width="290" height="34" rx="6" fill="#FCEFED" stroke="#A84943" stroke-width="1.5"/><text x="105" y="495.11" font-size="17" fill="#A84943" font-weight="700">Ineligible → reward 0</text><rect x="74" y="545" width="368" height="158" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="94" y="580.75" font-size="25" fill="#087F82" font-weight="700">Reconnaissance + adapters</text><text x="94" y="617.26" font-size="22" fill="#526779" font-weight="400">Goal → fixed, ordered criteria</text><text x="94" y="648.26" font-size="22" fill="#526779" font-weight="400">Artifact schemas → shared values</text><text x="94" y="677.6" font-size="20" fill="#526779" font-weight="400">Measured values; unknown = null</text><rect x="498" y="142" width="555" height="590" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="527.0" cy="172.0" rx="15.0" ry="15.0" fill="#2463A5" stroke="#2463A5" stroke-width="1.8"/><text x="519" y="175.77" font-size="19" fill="#FFFFFF" font-weight="700">B</text><text x="552" y="176.75" font-size="25" fill="#182C40" font-weight="700">Decide each workspace pair</text><rect x="525" y="204" width="211" height="34" rx="6" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="536" y="223.94" font-size="18" fill="#087F82" font-weight="700">Workspace A values</text><rect x="810" y="204" width="216" height="34" rx="6" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="821" y="223.94" font-size="18" fill="#087F82" font-weight="700">Workspace B values</text><polyline points="630,240 630,265 775,265 775,285" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><polygon points="775,285 779.32,276.0 770.68,276.0" fill="#2463A5"/><polyline points="915,240 915,265 775,265" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><rect x="525" y="288" width="501" height="139" rx="12" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.5"/><text x="545" y="323.75" font-size="25" fill="#2463A5" font-weight="700">Cached Python comparison policy</text><text x="545" y="360.26" font-size="22" fill="#526779" font-weight="400">Same task criteria for both workspaces</text><text x="545" y="391.26" font-size="22" fill="#526779" font-weight="400">Earliest decisive stage determines the verdict</text><text x="545" y="417.26" font-size="22" fill="#526779" font-weight="400">Reverse-order, self-tie + determinism checks</text><polyline points="775,429 775,484" fill="none" stroke="#7752A6" stroke-width="2.5" stroke-linejoin="round"/><polygon points="775,484 779.32,475.0 770.68,475.0" fill="#7752A6"/><text x="793" y="457.6" font-size="20" fill="#7752A6" font-weight="700">Only if code ties</text><rect x="525" y="486" width="501" height="142" rx="12" fill="#F5F0FA" stroke="#7752A6" stroke-width="1.5"/><text x="545" y="521.75" font-size="25" fill="#7752A6" font-weight="700">Image-based tie resolution</text><text x="545" y="558.26" font-size="22" fill="#526779" font-weight="400">Requires relevant images on both sides</text><text x="545" y="589.26" font-size="22" fill="#526779" font-weight="400">Judge A/B and B/A; winners must agree</text><text x="545" y="615.26" font-size="22" fill="#526779" font-weight="400">Absent, unclear or inconsistent → keep tie</text><polyline points="775,630 775,655" fill="none" stroke="#7752A6" stroke-width="2.5" stroke-linejoin="round"/><polygon points="775,655 779.32,646.0 770.68,646.0" fill="#7752A6"/><rect x="583" y="662" width="383" height="34" rx="6" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.5"/><text x="594" y="681.94" font-size="18" fill="#2463A5" font-weight="700">A wins  /  B wins  /  tie + evidence</text><rect x="1083" y="142" width="469" height="590" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="1112.0" cy="172.0" rx="15.0" ry="15.0" fill="#AF6425" stroke="#AF6425" stroke-width="1.8"/><text x="1104" y="175.77" font-size="19" fill="#FFFFFF" font-weight="700">C</text><text x="1137" y="176.75" font-size="25" fill="#182C40" font-weight="700">Rate and guide evolution</text><polyline points="1170,235 1280,235" fill="none" stroke="#AF6425" stroke-width="2" stroke-linejoin="round"/><polyline points="1170,235 1225,320" fill="none" stroke="#AF6425" stroke-width="2" stroke-linejoin="round"/><polyline points="1280,235 1225,320" fill="none" stroke="#AF6425" stroke-width="2" stroke-linejoin="round"/><ellipse cx="1170.0" cy="235.0" rx="24.0" ry="24.0" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.8"/><text x="1156" y="239.43" font-size="21" fill="#AF6425" font-weight="700">G₁</text><ellipse cx="1280.0" cy="235.0" rx="24.0" ry="24.0" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.8"/><text x="1266" y="239.43" font-size="21" fill="#AF6425" font-weight="700">G₂</text><ellipse cx="1225.0" cy="320.0" rx="24.0" ry="24.0" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.8"/><text x="1211" y="324.43" font-size="21" fill="#AF6425" font-weight="700">G₃</text><text x="1320" y="228.43" font-size="21" fill="#526779" font-weight="400">All pairs</text><text x="1320" y="259.43" font-size="21" fill="#526779" font-weight="400">in the task</text><text x="1320" y="290.43" font-size="21" fill="#526779" font-weight="400">session</text><polyline points="1240,348 1240,371" fill="none" stroke="#AF6425" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1240,371 1244.32,362.0 1235.68,362.0" fill="#AF6425"/><rect x="1109" y="375" width="417" height="137" rx="12" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1129" y="410.75" font-size="25" fill="#AF6425" font-weight="700">Regularized Bradley–Terry fit</text><text x="1129" y="447.26" font-size="22" fill="#526779" font-weight="400">Pair outcomes → latent strengths θ</text><text x="1129" y="478.26" font-size="22" fill="#526779" font-weight="400">P(i beats j) = σ(θᵢ − θⱼ)</text><text x="1129" y="503.26" font-size="22" fill="#526779" font-weight="400">Current reward: rᵢ = σ(θᵢ) if eligible</text><text x="1129" y="548.26" font-size="22" fill="#526779" font-weight="400">Refit every generation’s current reward</text><text x="1129" y="579.26" font-size="22" fill="#526779" font-weight="400">after each new evaluation.</text><rect x="1109" y="617" width="417" height="86" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="1129" y="652.75" font-size="25" fill="#087F82" font-weight="700">Evidence-grounded feedback</text><text x="1129" y="689.26" font-size="22" fill="#526779" font-weight="400">Earliest losses first; no scores or code</text><polyline points="1318,733 1318,786 258,786 258,733" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="258,733 253.68,742.0 262.32,742.0" fill="#087F82"/><rect x="533" y="765" width="507" height="43" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="548" y="790.09" font-size="23" fill="#087F82" font-weight="700">Selection + mutation → next generation</text><text x="48" y="855.77" font-size="19" fill="#526779" font-weight="400">Evolutionary pressure, not a benchmark grade.  σ = logistic function.  Admission verdicts also enter the tournament.</text><polyline points="1026,352 1038,352 1038,646 965,646 965,662" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><polygon points="965,662 969.32,653.0 960.68,653.0" fill="#2463A5"/><text x="829" y="651.28" font-size="16" fill="#2463A5" font-weight="700">Code decides</text><polyline points="966,679 1068,679 1068,235 1146,235" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1146,235 1137.0,230.68 1137.0,239.32" fill="#2463A5"/><polyline points="1068,679 1109,679" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1109,679 1100.0,674.68 1100.0,683.32" fill="#087F82"/><polyline points="422,463 422,545" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="422,545 426.32,536.0 417.68,536.0" fill="#087F82"/><text x="381" y="532.28" font-size="16" fill="#087F82" font-weight="400">pass</text><polyline points="442,615 481,615 481,221 525,221" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="525,221 516.0,216.68 516.0,225.32" fill="#087F82"/><polyline points="1526,450 1568,450 1568,786 1318,786" fill="none" stroke="#AF6425" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="1318,786 1327.0,790.32 1327.0,781.68" fill="#AF6425"/><polyline points="481,221 481,188 918,188 918,204" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="918,204 922.32,195.0 913.68,195.0" fill="#087F82"/></g></svg>