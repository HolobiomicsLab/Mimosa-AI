<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Policy-BT: comparison contract and tournament mathematics</title><desc id="desc">Implementation and scoring details. Snapshot admission precedes artifact comparison. Task criteria, order and representation remain fixed; schema adapters can expand and instrument code can be repaired without changing the success definition. The restricted interpreter checks reverse-order consistency, self-ties and repeated execution. Vision is conditional on a deterministic tie and relevant images from both sides. The tournament contains every unordered generation pair, including execution-admission outcomes. For each ordered representation (i,j) of an unordered pair, y is 1, 1/2 or 0 for an i win, tie or loss. A unit-precision zero-mean Gaussian prior regularizes the Bradley–Terry strengths. The published reward is the logistic probability of beating a neutral-strength opponent, except ineligible generations are forced to zero. Instrument failures are unscored. Pair results are keyed by bundle version. A bundle-version change recomputes every pair; in the current implementation, a new eligible generation changes that version through its schema assignment and visual selection. Current ratings refresh while historical arrival scores and previously emitted gradients are preserved. The first sum runs once over each unordered pair; minimization is over the full strength vector θ. An eligible generation beats an ineligible one; two ineligible generations tie.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="61.54" font-size="38" fill="#182C40" font-weight="700">Policy-BT: comparison contract and tournament mathematics</text><text x="48" y="102.25999999999999" font-size="22" fill="#526779" font-weight="400">Implementation-level view • task criteria remain fixed while artifact-schema adapters can expand.</text><rect x="48" y="140" width="464" height="653" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="77.0" cy="170.0" rx="15.0" ry="15.0" fill="#087F82" stroke="#087F82" stroke-width="1.8"/><text x="69" y="173.77" font-size="19" fill="#FFFFFF" font-weight="700">A</text><text x="102" y="174.75" font-size="25" fill="#182C40" font-weight="700">Evidence and task contract</text><rect x="72" y="201" width="416" height="113" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="92" y="236.75" font-size="25" fill="#087F82" font-weight="700">Owned workspace snapshot</text><text x="92" y="273.26" font-size="22" fill="#526779" font-weight="400">Original artifacts remain untouched</text><text x="92" y="304.26" font-size="22" fill="#526779" font-weight="400">Required .sh reproduction contract</text><polyline points="280,315 280,337" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="280,337 284.32,328.0 275.68,328.0" fill="#087F82"/><rect x="72" y="340" width="416" height="111" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="92" y="375.75" font-size="25" fill="#087F82" font-weight="700">Re-execution gate</text><text x="92" y="412.26" font-size="22" fill="#526779" font-weight="400">Clean venv; move old outputs aside</text><text x="92" y="436.26" font-size="22" fill="#526779" font-weight="400">Rerun optional; contract required</text><rect x="72" y="467" width="374" height="34" rx="6" fill="#FCEFED" stroke="#A84943" stroke-width="1.5"/><text x="83" y="486.11" font-size="17" fill="#A84943" font-weight="700">Fail → admission verdict; reward 0</text><rect x="72" y="528" width="416" height="117" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="92" y="563.75" font-size="25" fill="#087F82" font-weight="700">LLM reconnaissance</text><text x="92" y="600.26" font-size="22" fill="#526779" font-weight="400">Goal + inventory + inspected previews</text><text x="92" y="631.26" font-size="22" fill="#526779" font-weight="400">Fix criteria, stage order and value types</text><polyline points="280,646 280,667" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="280,667 284.32,658.0 275.68,658.0" fill="#087F82"/><rect x="72" y="670" width="416" height="97" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="92" y="705.75" font-size="25" fill="#087F82" font-weight="700">Schema-specific adapters</text><text x="92" y="742.26" font-size="22" fill="#526779" font-weight="400">Artifacts → values + path evidence</text><rect x="542" y="140" width="506" height="653" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="571.0" cy="170.0" rx="15.0" ry="15.0" fill="#2463A5" stroke="#2463A5" stroke-width="1.8"/><text x="563" y="173.77" font-size="19" fill="#FFFFFF" font-weight="700">B</text><text x="596" y="174.75" font-size="25" fill="#182C40" font-weight="700">Code first; images on ties</text><rect x="566" y="201" width="458" height="148" rx="12" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.5"/><text x="586" y="236.75" font-size="25" fill="#2463A5" font-weight="700">One cached comparison policy</text><text x="586" y="273.26" font-size="22" fill="#526779" font-weight="400">Validity / output conformance → quality</text><text x="586" y="304.26" font-size="22" fill="#526779" font-weight="400">Earliest decisive criterion wins</text><text x="586" y="335.26" font-size="22" fill="#526779" font-weight="400">Unknown values do not imply failure</text><rect x="566" y="366" width="458" height="34" rx="6" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.5"/><text x="577" y="385.94" font-size="18" fill="#2463A5" font-weight="700">Restricted interpreter + bounded repairs</text><text x="581" y="432.26" font-size="22" fill="#526779" font-weight="400">Check both orders, both self-ties</text><text x="581" y="463.26" font-size="22" fill="#526779" font-weight="400">and repeated forward execution.</text><polyline points="795,478 795,503" fill="none" stroke="#7752A6" stroke-width="2.5" stroke-linejoin="round"/><polygon points="795,503 799.32,494.0 790.68,494.0" fill="#7752A6"/><text x="810" y="493.77" font-size="19" fill="#7752A6" font-weight="700">Code tie only</text><rect x="566" y="510" width="458" height="164" rx="12" fill="#F5F0FA" stroke="#7752A6" stroke-width="1.5"/><text x="586" y="545.75" font-size="25" fill="#7752A6" font-weight="700">Relevant visual evidence</text><text x="586" y="578.26" font-size="22" fill="#526779" font-weight="400">Recon-selected images from both sides</text><text x="586" y="606.26" font-size="22" fill="#526779" font-weight="400">Vision model uses the same goal + criteria</text><text x="586" y="634.26" font-size="22" fill="#526779" font-weight="400">Accept only order-consistent outcomes</text><text x="586" y="662.26" font-size="22" fill="#526779" font-weight="400">Unresolved → pair stays tied</text><polyline points="795,676 795,698" fill="none" stroke="#7752A6" stroke-width="2.5" stroke-linejoin="round"/><polygon points="795,698 799.32,689.0 790.68,689.0" fill="#7752A6"/><rect x="566" y="702" width="458" height="65" rx="12" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.5"/><text x="586" y="736.09" font-size="23" fill="#2463A5" font-weight="700">Verdict · stage · evidence · feedback</text><rect x="1078" y="140" width="474" height="653" rx="16" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.5"/><ellipse cx="1107.0" cy="170.0" rx="15.0" ry="15.0" fill="#AF6425" stroke="#AF6425" stroke-width="1.8"/><text x="1099" y="173.77" font-size="19" fill="#FFFFFF" font-weight="700">C</text><text x="1132" y="174.75" font-size="25" fill="#182C40" font-weight="700">Persistent task tournament</text><rect x="1102" y="201" width="426" height="147" rx="12" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1122" y="236.75" font-size="25" fill="#AF6425" font-weight="700">Every unordered pair</text><text x="1122" y="273.26" font-size="22" fill="#526779" font-weight="400">Artifact + admission verdicts</text><text x="1122" y="304.26" font-size="22" fill="#526779" font-weight="400">Pair ledger keyed by bundle version</text><text x="1122" y="335.26" font-size="22" fill="#526779" font-weight="400">Bundle change → recompute all pairs</text><polyline points="1315,350 1315,376" fill="none" stroke="#AF6425" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1315,376 1319.32,367.0 1310.68,367.0" fill="#AF6425"/><rect x="1102" y="379" width="426" height="113" rx="12" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1122" y="414.75" font-size="25" fill="#AF6425" font-weight="700">Regularized strength estimation</text><text x="1122" y="451.26" font-size="22" fill="#526779" font-weight="400">All pairs, including admission verdicts</text><text x="1122" y="482.26" font-size="22" fill="#526779" font-weight="400">Fit latent θ; publish eligible σ(θ)</text><polyline points="1315,494 1315,518" fill="none" stroke="#AF6425" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1315,518 1319.32,509.0 1310.68,509.0" fill="#AF6425"/><rect x="1102" y="521" width="426" height="100" rx="12" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1122" y="556.75" font-size="25" fill="#AF6425" font-weight="700">Refresh all current rewards</text><text x="1122" y="593.26" font-size="22" fill="#526779" font-weight="400">Selection uses the refreshed ratings</text><rect x="1102" y="650" width="426" height="117" rx="12" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="1122" y="685.75" font-size="25" fill="#087F82" font-weight="700">Separate textual gradient</text><text x="1122" y="722.26" font-size="22" fill="#526779" font-weight="400">Order losses first, then earliest stage</text><text x="1122" y="753.26" font-size="22" fill="#526779" font-weight="400">Retain diagnoses; omit scores / code</text><rect x="48" y="821" width="1504" height="172" rx="12" fill="#EFF5FC" stroke="#D5DEE5" stroke-width="1.5"/><text x="72" y="854.77" font-size="19" fill="#2463A5" font-weight="700">BRADLEY–TERRY MODEL</text><text x="72" y="900.07" font-size="29" fill="#182C40" font-weight="700">pᵢⱼ = σ(θᵢ − θⱼ)</text><text x="72" y="942.43" font-size="21" fill="#526779" font-weight="400">yᵢⱼ = 1 (win), ½ (tie), 0 (loss)</text><text x="580" y="854.77" font-size="19" fill="#2463A5" font-weight="700">REGULARIZED OBJECTIVE</text><text x="580" y="895.09" font-size="23" fill="#182C40" font-weight="700">min over θ:  −Σ [yᵢⱼ log pᵢⱼ + (1−yᵢⱼ) log(1−pᵢⱼ)] + ½ Σ θᵢ²</text><text x="580" y="941.6" font-size="20" fill="#526779" font-weight="400">Unit Gaussian prior • rᵢ = σ(θᵢ) versus a neutral-strength opponent; ineligible rᵢ = 0.</text><text x="48" y="1024.94" font-size="18" fill="#526779" font-weight="400">No-pair eligible baseline: 0.5.  Instrument error: unscored, not reward 0.  Reruns are trusted local shell execution, not an OS sandbox.</text><polyline points="1024,735 1063,735 1063,265 1102,265" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1102,265 1093.0,260.68 1093.0,269.32" fill="#2463A5"/><polyline points="1063,735 1102,735" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1102,735 1093.0,730.68 1093.0,739.32" fill="#087F82"/><polyline points="1024,275 1035,275 1035,689 980,689 980,702" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><polygon points="980,702 984.32,693.0 975.68,693.0" fill="#2463A5"/><polyline points="471,452 471,528" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="471,528 475.32,519.0 466.68,519.0" fill="#087F82"/><text x="432" y="518.28" font-size="16" fill="#087F82" font-weight="400">pass</text><polyline points="488,720 527,720 527,275 566,275" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="566,275 557.0,270.68 557.0,279.32" fill="#087F82"/><text x="859" y="691.28" font-size="16" fill="#2463A5" font-weight="700">Code decides</text></g></svg>