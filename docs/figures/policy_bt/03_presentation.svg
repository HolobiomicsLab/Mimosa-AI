<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">One policy. Two evidence channels. A tournament reward.</title><desc id="desc">Presentation overview. Preserved workspace evidence is admitted and normalized, compared by one task-specific deterministic policy, and optionally judged visually after code ties. The full pair-verdict history feeds a regularized Bradley–Terry fit. All current generation rewards refresh; evidence-grounded feedback guides subsequent mutation. Neither raw win rate nor hidden benchmark labels define the reward. Admission verdicts precede the two artifact-evidence channels and also enter the tournament.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="61.54" font-size="38" fill="#182C40" font-weight="700">One policy. Two evidence channels. A tournament reward.</text><text x="48" y="102.25999999999999" font-size="22" fill="#526779" font-weight="400">Policy-BT evaluates scientific outputs across workflow generations—not against hidden benchmark answers.</text><rect x="48" y="144" width="335" height="34" rx="6" fill="#EDF8F6" stroke="#087F82" stroke-width="1.5"/><text x="59" y="163.94" font-size="18" fill="#087F82" font-weight="700">01   PRESERVE THE EVIDENCE</text><rect x="580" y="144" width="440" height="34" rx="6" fill="#EFF5FC" stroke="#2463A5" stroke-width="1.5"/><text x="591" y="163.94" font-size="18" fill="#2463A5" font-weight="700">02   COMPARE UNDER ONE CONTRACT</text><rect x="1144" y="144" width="408" height="34" rx="6" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1155" y="163.94" font-size="18" fill="#AF6425" font-weight="700">03   UPDATE THE EVOLUTION SIGNAL</text><rect x="48" y="204" width="440" height="449" rx="18" fill="#FFFFFF" stroke="#087F82" stroke-width="1.5"/><rect x="96" y="241" width="62" height="72" rx="4" fill="#FFFFFF" stroke="#087F82" stroke-width="1.5"/><rect x="87" y="251" width="62" height="72" rx="4" fill="#FFFFFF" stroke="#087F82" stroke-width="1.5"/><polyline points="99,269 135,269" fill="none" stroke="#087F82" stroke-width="2" stroke-linejoin="round"/><polyline points="99,283 135,283" fill="none" stroke="#087F82" stroke-width="2" stroke-linejoin="round"/><polyline points="99,297 123,297" fill="none" stroke="#087F82" stroke-width="2" stroke-linejoin="round"/><text x="186" y="264.58" font-size="26" fill="#182C40" font-weight="700">Workspace snapshots</text><text x="186" y="306.09" font-size="23" fill="#526779" font-weight="400">Code, logs, tables</text><text x="186" y="337.09" font-size="23" fill="#526779" font-weight="400">and visual artifacts</text><polyline points="268,342 268,372" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="268,372 272.32,363.0 263.68,363.0" fill="#087F82"/><text x="84" y="414.07" font-size="29" fill="#087F82" font-weight="700">Reproduce → normalize</text><text x="84" y="461.92" font-size="24" fill="#526779" font-weight="400">Required reproduction contract</text><text x="84" y="499.92" font-size="24" fill="#526779" font-weight="400">Fresh-venv rerun by default</text><text x="84" y="537.92" font-size="24" fill="#526779" font-weight="400">Schema adapters read real outputs</text><rect x="84" y="580" width="367" height="34" rx="6" fill="#FCEFED" stroke="#A84943" stroke-width="1.5"/><text x="95" y="599.94" font-size="18" fill="#A84943" font-weight="700">Ineligible generations receive 0</text><polyline points="489,421 549,421" fill="none" stroke="#087F82" stroke-width="2.5" stroke-linejoin="round"/><polygon points="549,421 540.0,416.68 540.0,425.32" fill="#087F82"/><rect x="550" y="204" width="500" height="449" rx="18" fill="#FFFFFF" stroke="#2463A5" stroke-width="1.5"/><text x="580" y="260.07" font-size="29" fill="#2463A5" font-weight="700">Deterministic Python policy</text><text x="580" y="305.09" font-size="23" fill="#526779" font-weight="400">Goal-defined criteria, fixed across the task</text><text x="580" y="342.09" font-size="23" fill="#526779" font-weight="400">Earliest decisive stage → win / loss / tie</text><polyline points="800,370 800,421" fill="none" stroke="#7752A6" stroke-width="2.5" stroke-linejoin="round"/><polygon points="800,421 804.32,412.0 795.68,412.0" fill="#7752A6"/><text x="818" y="401.26" font-size="22" fill="#7752A6" font-weight="700">Only on a tie</text><rect x="581" y="449" width="104" height="72" rx="4" fill="#FFFFFF" stroke="#7752A6" stroke-width="1.5"/><polyline points="595,461 595,506 671,506" fill="none" stroke="#7752A6" stroke-width="1.5" stroke-linejoin="round"/><polyline points="600,498 616,488 629,493 648,472 669,467" fill="none" stroke="#7752A6" stroke-width="3" stroke-linejoin="round"/><text x="714" y="469.41" font-size="27" fill="#7752A6" font-weight="700">Image-based judge</text><text x="714" y="511.26" font-size="22" fill="#526779" font-weight="400">Relevant images on both sides</text><text x="714" y="544.26" font-size="22" fill="#526779" font-weight="400">Agreement in both orders</text><rect x="581" y="580" width="437" height="34" rx="6" fill="#F5F0FA" stroke="#7752A6" stroke-width="1.5"/><text x="592" y="599.94" font-size="18" fill="#7752A6" font-weight="700">Unresolved visual comparison remains tied</text><polyline points="1051,421 1113,421" fill="none" stroke="#2463A5" stroke-width="2.5" stroke-linejoin="round"/><polygon points="1113,421 1104.0,416.68 1104.0,425.32" fill="#2463A5"/><rect x="1114" y="204" width="438" height="449" rx="18" fill="#FFFFFF" stroke="#AF6425" stroke-width="1.5"/><polyline points="1179,261 1289,261" fill="none" stroke="#AF6425" stroke-width="2" stroke-linejoin="round"/><polyline points="1179,261 1234,346" fill="none" stroke="#AF6425" stroke-width="2" stroke-linejoin="round"/><polyline points="1289,261 1234,346" fill="none" stroke="#AF6425" stroke-width="2" stroke-linejoin="round"/><ellipse cx="1179.0" cy="261.0" rx="24.0" ry="24.0" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.8"/><text x="1165" y="265.43" font-size="21" fill="#AF6425" font-weight="700">G₁</text><ellipse cx="1289.0" cy="261.0" rx="24.0" ry="24.0" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.8"/><text x="1275" y="265.43" font-size="21" fill="#AF6425" font-weight="700">G₂</text><ellipse cx="1234.0" cy="346.0" rx="24.0" ry="24.0" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.8"/><text x="1220" y="350.43" font-size="21" fill="#AF6425" font-weight="700">G₃</text><text x="1340" y="260.58" font-size="26" fill="#AF6425" font-weight="700">All-pairs</text><text x="1340" y="299.58" font-size="26" fill="#AF6425" font-weight="700">tournament</text><text x="1144" y="414.07" font-size="29" fill="#AF6425" font-weight="700">Bradley–Terry rewards</text><text x="1144" y="461.92" font-size="24" fill="#526779" font-weight="400">Fit strengths from pair outcomes</text><text x="1144" y="499.92" font-size="24" fill="#526779" font-weight="400">Refresh every current rating</text><text x="1144" y="537.92" font-size="24" fill="#526779" font-weight="400">Evidence → actionable feedback</text><rect x="1144" y="580" width="378" height="34" rx="6" fill="#FFF5E9" stroke="#AF6425" stroke-width="1.5"/><text x="1155" y="598.28" font-size="16" fill="#AF6425" font-weight="700">Reward ≠ raw win rate ≠ benchmark grade</text><polyline points="1333,656 1333,741 268,741 268,656" fill="none" stroke="#087F82" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="268,656 263.68,665.0 272.32,665.0" fill="#087F82"/><rect x="438" y="707" width="706" height="88" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><text x="457" y="740.07" font-size="29" fill="#087F82" font-weight="700">Selection + evidence-grounded mutation</text><text x="590" y="777.09" font-size="23" fill="#526779" font-weight="400">Generate the next workspace</text><text x="48" y="860.26" font-size="22" fill="#526779" font-weight="400">Code decides first. Images can break a tie. Bradley–Terry converts the verdict history into a current reward.</text></g></svg>